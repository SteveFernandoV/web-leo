<!-- ========================================================================
     COMPONENTE TÁCTICO HUD: CURSOR INTERACTIVO DE ALTA PRECISIÓN (CERO ERRORES)
     ======================================================================== -->

<!-- 1. MARCADO HTML (Insertar al final de <body>) -->
<div id="tacticalCursor" aria-hidden="true">
  <span id="tacticalCursorBadge">[TARGET]</span>
</div>
<div id="tacticalCursorDot" aria-hidden="true"></div>

<!-- 2. ESTILOS CSS (Insertar en tu hoja de estilos o dentro de <style>) -->
<style>
  :root {
    --neon-cyan: #00e5ff;
    --neon-pink: #ff007f;
    --bg-void: #03060c;
  }

  /* Solo oculta el cursor nativo cuando el cursor táctico esté confirmado activo */
  body.tactical-cursor-ready {
    cursor: default;
  }
  @media (hover: hover) and (pointer: fine) {
    body.tactical-cursor-ready.hide-native-cursor,
    body.tactical-cursor-ready.hide-native-cursor * {
      cursor: none !important;
    }
  }

  #tacticalCursor, #tacticalCursorDot, #tacticalCursorBadge {
    pointer-events: none !important;
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  #tacticalCursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 36px;
    height: 36px;
    box-sizing: border-box;
    border: 1.5px solid var(--neon-cyan);
    border-radius: 50%;
    z-index: 9999999;
    opacity: 0;
    will-change: transform, opacity;
    transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
    transition: opacity 0.15s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.25), 0 0 15px rgba(0, 229, 255, 0.2);
  }

  /* Eje Horizontal */
  #tacticalCursor::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 2px;
    left: -4px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--neon-cyan);
    box-shadow: 30px 0 0 var(--neon-cyan);
    pointer-events: none;
    transition: background-color 0.18s ease, box-shadow 0.18s ease;
  }

  /* Eje Vertical */
  #tacticalCursor::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 8px;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--neon-cyan);
    box-shadow: 0 30px 0 var(--neon-cyan);
    pointer-events: none;
    transition: background-color 0.18s ease, box-shadow 0.18s ease;
  }

  /* Punto Central de Mira (Par: 6px para 0 error subpixel) */
  #tacticalCursorDot {
    position: fixed;
    top: 0;
    left: 0;
    width: 6px;
    height: 6px;
    box-sizing: border-box;
    background-color: var(--neon-pink);
    border-radius: 50%;
    z-index: 10000000;
    opacity: 0;
    will-change: transform, opacity;
    transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
    box-shadow: 0 0 8px var(--neon-pink);
    transition: opacity 0.15s ease, background-color 0.18s ease, box-shadow 0.18s ease;
  }

  /* Telemetría Flotante HUD */
  #tacticalCursorBadge {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    font-family: monospace, system-ui, sans-serif;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--neon-cyan);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    background: rgba(3, 6, 12, 0.94);
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid rgba(0, 229, 255, 0.45);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
  }

  /* Estado Hover */
  body.cursor-hover #tacticalCursor {
    border-color: var(--neon-pink);
    background-color: rgba(255, 0, 127, 0.08);
    box-shadow: 0 0 0 1px rgba(255, 0, 127, 0.4), 0 0 20px rgba(255, 0, 127, 0.3);
  }
  body.cursor-hover #tacticalCursor::before {
    background: var(--neon-pink);
    box-shadow: 30px 0 0 var(--neon-pink);
  }
  body.cursor-hover #tacticalCursor::after {
    background: var(--neon-pink);
    box-shadow: 0 30px 0 var(--neon-pink);
  }
  body.cursor-hover #tacticalCursorDot {
    background-color: var(--neon-cyan);
    box-shadow: 0 0 10px var(--neon-cyan);
  }
  body.cursor-hover #tacticalCursorBadge {
    opacity: 1;
    color: var(--neon-pink);
    border-color: rgba(255, 0, 127, 0.6);
    transform: translateX(-50%) translateY(10px);
  }

  /* Estado Disparo / Clic */
  #tacticalCursor.cursor-active {
    border-color: #ffffff;
    background-color: rgba(0, 229, 255, 0.25);
    box-shadow: 0 0 0 1px #ffffff, 0 0 25px rgba(0, 229, 255, 0.6);
  }

  /* Desactivación Limpia en Móviles */
  @media (max-width: 900px), (hover: none), (pointer: coarse) {
    #tacticalCursor, #tacticalCursorDot, #tacticalCursorBadge {
      display: none !important;
    }
  }
</style>

<!-- 3. MOTOR JAVASCRIPT ACCELERATED (Insertar en tu <script>) -->
<script>
  (() => {
    const cursor = document.getElementById('tacticalCursor');
    const cursorDot = document.getElementById('tacticalCursorDot');
    const badge = document.getElementById('tacticalCursorBadge');
    if (!cursor || !cursorDot) return;

    let clientX = -100;
    let clientY = -100;
    let isVisible = false;
    let isHovered = false;
    let isMouseDown = false;

    // Bucle RAF a 60/120/144Hz para fluidez total
    function renderLoop() {
      if (isVisible) {
        const scale = isMouseDown ? 0.82 : (isHovered ? 1.25 : 1.0);
        cursor.style.transform = `translate3d(${clientX}px, ${clientY}px, 0) translate(-50%, -50%) scale(${scale})`;
        cursorDot.style.transform = `translate3d(${clientX}px, ${clientY}px, 0) translate(-50%, -50%)`;
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function onMove(e) {
      if (e.pointerType === 'touch') {
        cursor.style.opacity = '0';
        cursorDot.style.opacity = '0';
        isVisible = false;
        return;
      }

      clientX = e.clientX;
      clientY = e.clientY;

      if (!isVisible) {
        isVisible = true;
        cursor.style.opacity = '1';
        cursorDot.style.opacity = '1';
        document.body.classList.add('tactical-cursor-ready');
      }
    }

    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('mousemove', onMove, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      isMouseDown = true;
      cursor.classList.add('cursor-active');
    }, { passive: true });

    window.addEventListener('pointerup', () => {
      isMouseDown = false;
      cursor.classList.remove('cursor-active');
    }, { passive: true });

    // Delegación inteligente de elementos interactivos
    const targetSelector = 'a, button, input, select, textarea, [role="button"], [tabindex="0"], .interactive, .btn, .card';

    document.addEventListener('mouseover', (e) => {
      const target = e.target.closest(targetSelector);
      if (target) {
        if (!isHovered) {
          isHovered = true;
          document.body.classList.add('cursor-hover');
        }

        if (badge) {
          let text = '[INTERACTUAR]';
          if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') text = '[ESCRIBIR]';
          else if (target.tagName === 'A') text = '[ACCEDER]';
          else if (target.tagName === 'BUTTON') text = '[EJECUTAR]';
          badge.textContent = text;
        }
      }
    }, { passive: true });

    document.addEventListener('mouseout', (e) => {
      const current = e.target.closest(targetSelector);
      const next = e.relatedTarget ? e.relatedTarget.closest(targetSelector) : null;

      if (current && !next) {
        isHovered = false;
        document.body.classList.remove('cursor-hover');
        if (badge) badge.textContent = '[TARGET]';
      }
    }, { passive: true });

    window.addEventListener('blur', () => {
      cursor.style.opacity = '0';
      cursorDot.style.opacity = '0';
      isVisible = false;
    });
    window.addEventListener('focus', () => {
      cursor.style.opacity = '1';
      cursorDot.style.opacity = '1';
      isVisible = true;
    });
  })();
</script>
