<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎯 Test Cursor HUD</title>
<style>
  body { background: #0a0a0f; color: #00e5ff; font-family: monospace; padding: 40px; cursor: none !important; min-height: 100vh; }
  h1 { color: #fff; }
  .log { background: #111; border: 1px solid #00e5ff33; padding: 16px; border-radius: 8px; margin: 20px 0; min-height: 100px; font-size: 13px; line-height: 1.8; }
  button { background: linear-gradient(135deg, #00e5ff22, #ff007f22); border: 1px solid #00e5ff; color: #00e5ff; padding: 12px 24px; border-radius: 8px; cursor: none; font-size: 14px; margin: 8px; }
  button:hover { background: linear-gradient(135deg, #00e5ff44, #ff007f44); }

  @media (hover: hover) and (pointer: fine) {
    .hud-cursor-dot {
      position: fixed; top: 0; left: 0; width: 8px; height: 8px;
      margin: -4px 0 0 -4px; border-radius: 50%; background: #00e5ff;
      pointer-events: none !important; z-index: 2147483647;
      box-shadow: 0 0 10px #00e5ff, 0 0 4px #fff; opacity: 0;
      will-change: transform; transition: opacity 0.25s ease;
    }
    .hud-cursor-dot::after {
      content: ''; position: absolute; top: 2.5px; left: 2.5px;
      width: 3px; height: 3px; background: #ff007f; border-radius: 50%;
    }
    .hud-cursor-dot.visible { opacity: 1; }
    .hud-cursor-ring {
      position: fixed; top: 0; left: 0; width: 38px; height: 38px;
      margin: -19px 0 0 -19px; border: 1.5px solid rgba(0,229,255,0.7);
      border-radius: 50%; pointer-events: none !important; z-index: 2147483646;
      opacity: 0; box-sizing: border-box; will-change: transform;
    }
    .hud-cursor-ring.visible { opacity: 1; }
    .hud-cursor-ring .ring-bracket { position: absolute; width: 7px; height: 7px; border-color: #00e5ff; border-style: solid; }
    .hud-cursor-ring .ring-bracket.tl { top:-2px; left:-2px; border-width:2px 0 0 2px; }
    .hud-cursor-ring .ring-bracket.tr { top:-2px; right:-2px; border-width:2px 2px 0 0; }
    .hud-cursor-ring .ring-bracket.bl { bottom:-2px; left:-2px; border-width:0 0 2px 2px; }
    .hud-cursor-ring .ring-bracket.br { bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
    .hud-cursor-ring.active-lock { width:54px; height:54px; margin:-27px 0 0 -27px; border-color:#00e5ff; box-shadow: 0 0 18px rgba(0,229,255,0.6); }
    .hud-cursor-ring.active-lock .ring-bracket { border-color: #ff007f; }
  }
</style>
</head>
<body>

<h1>🎯 Test Diagnóstico — Cursor HUD Táctico</h1>
<p>Mueve el mouse sobre esta página. El cursor cyan debe seguirte.</p>

<div id="log" class="log">⏳ Iniciando diagnóstico...</div>

<button id="btn1">Botón de Prueba 1</button>
<button id="btn2">Botón de Prueba 2</button>
<a href="#" style="color:#00e5ff; margin:16px; display:inline-block; cursor:none;">Enlace de Prueba</a>

<div id="hudCursorDot" class="hud-cursor-dot" aria-hidden="true"></div>
<div id="hudCursorRing" class="hud-cursor-ring" aria-hidden="true">
  <span class="ring-bracket tl"></span>
  <span class="ring-bracket tr"></span>
  <span class="ring-bracket bl"></span>
  <span class="ring-bracket br"></span>
</div>

<script>
  const log = document.getElementById('log');
  function addLog(msg, color) {
    const line = document.createElement('div');
    line.style.color = color || '#00e5ff';
    line.textContent = (new Date().toLocaleTimeString()) + ' → ' + msg;
    log.appendChild(line);
  }

  document.addEventListener('DOMContentLoaded', function() {
    addLog('✓ DOMContentLoaded disparado', '#00ff88');
    
    const dot = document.getElementById('hudCursorDot');
    const ring = document.getElementById('hudCursorRing');
    
    addLog('dot element: ' + (dot ? '✓ ENCONTRADO' : '❌ NULL'), dot ? '#00ff88' : '#ff4444');
    addLog('ring element: ' + (ring ? '✓ ENCONTRADO' : '❌ NULL'), ring ? '#00ff88' : '#ff4444');
    
    const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    addLog('(hover:hover) and (pointer:fine): ' + (isFine ? '✓ TRUE (cursor activo)' : '❌ FALSE (touch device)'), isFine ? '#00ff88' : '#ff9900');
    
    if (!dot || !ring || !isFine) {
      addLog('⛔ No se inicializa el cursor. Ver errores arriba.', '#ff4444');
      return;
    }
    
    let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0, isVisible = false;
    let moveCount = 0;

    document.addEventListener('pointermove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      if (!isVisible) {
        isVisible = true;
        dot.classList.add('visible');
        ring.classList.add('visible');
        ringX = mouseX; ringY = mouseY;
        addLog('✓ Primera detección de mouse — cursor activado', '#00ff88');
      }
      dot.style.transform = `translate3d(${mouseX}px,${mouseY}px,0)`;
      moveCount++;
      if (moveCount % 30 === 0) addLog(`🖱️ Mouse en (${mouseX}, ${mouseY})`, '#aaa');
      requestAnimationFrame(() => {
        ringX += (mouseX - ringX) * 0.22;
        ringY += (mouseY - ringY) * 0.22;
        ring.style.transform = `translate3d(${ringX}px,${ringY}px,0)`;
      });
    }, { passive: true });

    document.addEventListener('pointerover', (e) => {
      if (e.target.closest('button, a, .btn')) {
        ring.classList.add('active-lock');
        addLog('🔒 Lock-on activado sobre botón', '#ff007f');
      }
    });
    document.addEventListener('pointerout', (e) => {
      if (!e.relatedTarget?.closest('button, a, .btn')) {
        ring.classList.remove('active-lock');
      }
    });

    addLog('✓ Motor del cursor iniciado correctamente', '#00ff88');
  });
</script>
</body>
</html>
